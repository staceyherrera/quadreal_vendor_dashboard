<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuadReal Vendor Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%BE%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#EEF2FA; --ink:#1A1A2E; --muted:#5D6578; --line:#DCE2EE;
  --navy:#173073; --navy-2:#22408F; --blue:#4974FF; --accent:#2F55D4; --accent-soft:#E8F0FE; --accent-ink:#FFFFFF;
  --fund:#1E7A55; --fund-soft:#E2F3EA; --warn:#7F5C0B; --warn-soft:#FAF0D6; --pend:#D0AA46;
  --bad:#B42318; --bad-soft:#FCEAE8; --teal:#00788A; --teal-soft:#DCF4F8;
  --hero:#173073; --hero-ink:#FFFFFF; --hero-muted:#E4EAFF;
  --shadow:0 1px 2px rgba(23,48,115,.06),0 4px 14px rgba(23,48,115,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1330; --surface:#131C3E; --sunk:#1A2550; --ink:#E8ECF7; --muted:#A4AECA; --line:#2A3666;
    --navy:#8FA9FF; --navy-2:#A9BDFF; --blue:#6E8FFF; --accent:#93ADFF; --accent-soft:#1E2C62; --accent-ink:#0C1330;
    --fund:#62C99C; --fund-soft:#15352B; --warn:#E3BE62; --warn-soft:#3A2F12; --pend:#D0AA46;
    --bad:#F28B7F; --bad-soft:#3D1C1B; --teal:#5CD3E4; --teal-soft:#123843;
    --hero:#10215A; --hero-ink:#FFFFFF; --hero-muted:#E4EAFF; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1330; --surface:#131C3E; --sunk:#1A2550; --ink:#E8ECF7; --muted:#A4AECA; --line:#2A3666;
  --navy:#8FA9FF; --navy-2:#A9BDFF; --blue:#6E8FFF; --accent:#93ADFF; --accent-soft:#1E2C62; --accent-ink:#0C1330;
  --fund:#62C99C; --fund-soft:#15352B; --warn:#E3BE62; --warn-soft:#3A2F12; --pend:#D0AA46;
  --bad:#F28B7F; --bad-soft:#3D1C1B; --teal:#5CD3E4; --teal-soft:#123843;
  --hero:#10215A; --hero-ink:#FFFFFF; --hero-muted:#E4EAFF; --shadow:none; color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:16px;font-weight:700}
h2{font-size:21px;font-weight:700;color:var(--navy)}
h3{font-size:15px;font-weight:700;color:var(--navy)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{text-align:right;white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(23,48,115,.03)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;margin-right:auto}
.logo{height:30px;width:auto;display:block}
.logo.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.lt{display:none}:root:not([data-theme="light"]) .logo.dk{display:block}}
:root[data-theme="dark"] .logo.lt{display:none} :root[data-theme="dark"] .logo.dk{display:block}
.divider{width:1px;height:28px;background:var(--line)}
.ptitle{font-size:16px;font-weight:700;color:var(--navy)}
.asof{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.asof{display:none}.logo{height:24px}}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:6px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--accent-ink)}

main{max-width:1320px;margin:0 auto;padding:24px}

  background-size:100% 100%,auto 100%;background-position:left top,right center;background-repeat:no-repeat}
.hero>*{position:relative;z-index:1}
.hero h2{color:var(--hero-ink);font-size:26px;letter-spacing:-.01em;max-width:30ch;text-shadow:0 1px 2px rgba(10,30,100,.25)}
.hero-sub{color:var(--hero-muted);margin-top:6px;max-width:62ch}
.hero-top{margin-bottom:16px}
.hero-top label{color:var(--hero-muted)}
.hero select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:var(--hero-ink);max-width:100%}
.hero select option{color:#1A1A2E;background:#fff}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px;max-width:760px}
@media (max-width:760px){.hero-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:22px 20px;background-image:linear-gradient(90deg,rgba(24,52,170,.38),rgba(24,52,170,.15))}}
.hero-stats div{border-left:2px solid rgba(255,255,255,.45);padding-left:12px}
.hero-stats span{display:block;font-size:12.5px;color:var(--hero-muted)}
.hero-stats b{display:block;font-size:22px;margin-top:2px;white-space:nowrap}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 14px;cursor:pointer;color:var(--muted);font-weight:700;font-size:14.5px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:12px;text-align:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.stack>*+*{margin-top:16px}
label.f{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(73,116,255,.18)}
textarea{min-height:76px;resize:vertical}
select.inline{width:auto;min-width:260px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--accent-ink)}
.btn.primary:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.good{background:var(--fund);border-color:var(--fund);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* submit */
.submit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px;align-items:start}
@media (max-width:960px){.submit{grid-template-columns:1fr}}
.step{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.step-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--navy);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.drop{border:1.5px dashed #9FB4F5;border-radius:12px;padding:30px 16px;text-align:center;background:var(--accent-soft);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--blue)}
.drop b{color:var(--navy)}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.file-ic{width:34px;height:40px;border-radius:5px;background:var(--bad-soft);color:var(--bad);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.drop{transition:none}}
.extracted{font-size:12.5px;color:var(--muted);margin-top:5px}
.flag{font-size:12.5px;color:var(--warn)}
.list{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-left:3px solid transparent}
.opt:last-child{border-bottom:0}
.opt:hover{background:var(--sunk)}
.opt.sel{background:var(--accent-soft);border-left-color:var(--blue)}
.opt.off{opacity:.5;cursor:not-allowed}
.opt .t{font-weight:700}
.opt input{accent-color:var(--blue)}
.kind{font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:7px}

/* funds meter */
.meter{margin-top:8px}
.meter-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.meter-bar span{display:block;height:100%}
.m-pend{background:repeating-linear-gradient(135deg,var(--pend) 0 5px,transparent 5px 9px);background-color:var(--warn-soft)}
.m-this{background:var(--blue)}
.m-left{background:var(--fund)}
.m-over{background:var(--bad)}
.meter-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.meter-legend b{display:block;font-size:15px;color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:10px;padding:6px 0;font-size:14px}
.ck{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.ck.ok{background:var(--fund-soft);color:var(--fund)}
.ck.no{background:var(--bad-soft);color:var(--bad)}
.ck.wait{background:var(--sunk);color:var(--muted)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:700;font-size:12.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
tbody tr.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--blue)}
td .sub{display:block;color:var(--muted);font-size:12.5px}
.neg{color:var(--bad)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.s-Submitted{background:var(--sunk);color:var(--muted)}
.s-In-review{background:var(--accent-soft);color:var(--accent)}
.s-Needs-info{background:var(--warn-soft);color:var(--warn)}
.s-Approved{background:var(--fund-soft);color:var(--fund)}
.s-Entered-in-Yardi{background:var(--teal-soft);color:var(--teal)}
.s-Paid{background:var(--fund);color:var(--surface)}
.s-Rejected{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);margin:3px 4px 0 0}
.tag.w{border-color:var(--warn);color:var(--warn)}

/* request tracker */
.req{padding:18px 22px;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.track div{font-size:12px;color:var(--muted);padding-top:8px;border-top:4px solid var(--sunk)}
.track div.done{border-top-color:var(--fund);color:var(--ink)}
.track div.now{border-top-color:var(--blue);color:var(--navy);font-weight:700}
.note{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px}
.note.w{background:var(--warn-soft)}
.note.b{background:var(--bad-soft)}

/* back office */
.bo{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1100px){.bo{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink)}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--accent-ink);border-color:var(--navy)}
.chip[aria-pressed="true"] .muted{color:inherit;opacity:.75}
.review{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
@media (max-width:1100px){.review{position:static}}
.inv-doc{border:1px solid var(--line);border-radius:6px;background:#fff;color:#1A1A2E;padding:16px;font-size:13px}
.inv-doc .muted{color:#5D6578}
.inv-doc .h{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #173073;padding-bottom:8px;margin-bottom:10px}
.inv-doc .big{font-size:20px;font-weight:700;color:#173073}
.att-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 10px}
.viewer{max-height:520px;overflow:auto;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px}
.viewer.big{max-height:none}
.viewer canvas{display:block;width:100%;height:auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);margin:0 auto 10px}
.viewer canvas:last-child{margin-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.hist{list-style:none;padding:0;margin:0;font-size:13.5px}
.hist li{padding:6px 0 6px 16px;border-left:2px solid var(--line);position:relative}
.hist li::before{content:"";position:absolute;left:-5px;top:12px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.err{color:var(--bad);font-size:13px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{padding:16px 18px}
.kpi b{display:block;font-size:22px;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--accent-ink);padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;z-index:20;box-shadow:0 8px 24px rgba(23,48,115,.3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.foot{max-width:1320px;margin:0 auto;padding:8px 24px 28px;font-size:12.5px;color:var(--muted)}

/* sign-in and account */
.login{max-width:440px;margin:40px auto;padding:30px 30px 28px}
.who{color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){.who{display:none}}
#nav{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
</style>
</head>
